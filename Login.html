
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HydroFarm</title>

    <link rel="stylesheet" href="Login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="login-layout">

        <section class="login-card">

            <!-- HydroFarm Logo -->
            <div class="login-logo">
                <img src="Images/hydrofarm-logo1.png"
                     alt="HydroFarm Logo">
            </div>

            <!-- Heading -->
            <div class="login-heading">
                <h1>Welcome Back</h1>
                <p>Sign in to continue to your account</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="show-password"
                            aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>

                    </div>
                </div>

                <!-- Remember and Forgot Password -->
                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="Contact.html">Forgot password?</a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-button">
                    <i class="fas fa-right-to-bracket"></i>
                     Login
                </button>

                <p id="loginMessage" role="status"></p>

            </form>

            <!-- Divider -->
            <div class="separator">
                <span></span>
                <p>Or continue with</p>
                <span></span>
            </div>

            <!-- Social Login -->
            <div class="social-login">

                <button type="button"
                        class="social-button google-button"
                        id="googleLogin">

                    <i class="fab fa-google google-icon"></i>
                    Google

                </button>

                <button type="button"
                        class="social-button apple-button"
                        id="appleLogin">

                    <i class="fab fa-apple"></i>
                    Apple

                </button>

            </div>

            <!-- Sign Up -->
            <p class="signup-text">
                Don't have an account?
                <a href="Register.html">Create a free account</a>
            </p>

        </section>

    </main>

    <footer class="login-footer">
        © <span id="currentYear"></span> HydroFarm.
        Grow Fresh. Grow Smart. Grow Sustainably.
    </footer>

    <script src="Login.js"></script>

</body>
</html>
